<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>App Truyền Data Trần Cường</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

</head>

<body>

<div class="app-frame">

    <!-- HEADER -->

    <div class="header-card">

        <div class="app-icon">
            🚀
        </div>

        <div class="app-title">
            App Truyền Data Trần Cường
        </div>

        <div class="app-subtitle">
            Firebase + WebRTC Secure Transfer
        </div>

    </div>

    <!-- STATUS -->

    <div class="status-card">

        <div class="status-label">
            Trạng Thái
        </div>

        <div id="connectionStatus" class="status-value ready">
            Sẵn Sàng
        </div>

    </div>

    <!-- SEND -->

    <div class="section-card">

        <div class="section-title">
            📤 Gửi File
        </div>

        <label for="fileInput" class="btn3d primary-btn">
            Chọn File
        </label>

        <input
            type="file"
            id="fileInput"
            hidden
        >

        <div id="fileName" class="file-name">
            Chưa chọn file
        </div>

        <div class="room-box">

            <div class="room-label">
                Mã Phòng
            </div>

            <div id="roomCode" class="room-code">
                ------
            </div>

        </div>

        <div id="qrWrapper" class="qr-wrapper">

            <canvas id="qrCanvas"></canvas>

        </div>

        <button
            id="createRoomBtn"
            class="btn3d success-btn"
        >
            Tạo Phòng
        </button>

    </div>

    <!-- RECEIVE -->

    <div class="section-card">

        <div class="section-title">
            📥 Nhận File
        </div>

        <input
            type="text"
            id="roomInput"
            maxlength="6"
            placeholder="Nhập mã phòng"
            class="room-input"
        >

        <button
            id="joinRoomBtn"
            class="btn3d blue-btn"
        >
            Kết Nối
        </button>

    </div>

    <!-- TRANSFER -->

    <div class="transfer-card">

        <div class="transfer-title">
            Tiến Trình Truyền
        </div>

        <div class="progress-wrap">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

        <div
            id="progressPercent"
            class="progress-percent">
            0%
        </div>

        <div class="stats-grid">

            <div class="stat-box">

                <div class="stat-label">
                    Đã Truyền
                </div>

                <div
                    id="transferSize"
                    class="stat-value">
                    0 MB
                </div>

            </div>

            <div class="stat-box">

                <div class="stat-label">
                    Tốc Độ
                </div>

                <div
                    id="transferSpeed"
                    class="stat-value">
                    0 MB/s
                </div>

            </div>

        </div>

        <div class="stats-grid">

            <div class="stat-box">

                <div class="stat-label">
                    Còn Lại
                </div>

                <div
                    id="remainingTime"
                    class="stat-value">
                    --
                </div>

            </div>

            <div class="stat-box">

                <div class="stat-label">
                    Loại
                </div>

                <div
                    id="transferMode"
                    class="stat-value">
                    Idle
                </div>

            </div>

        </div>

    </div>

    <!-- LOG -->

    <div class="log-card">

        <div class="log-title">
            Nhật Ký
        </div>

        <div id="logBox" class="log-box">

            Hệ thống khởi động...

        </div>

    </div>

</div>

<!-- TOAST -->

<div
    id="toast"
    class="toast">
</div>

<script type="module" src="script.js"></script>

</body>
</html>

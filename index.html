<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Truyền Dữ Liệu Trần Cường</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="app-container">
        <h1 class="app-title">App Truyền Dữ Liệu</br>***Trần Cường***</h1>

        <div class="my-id-section">
            <span>ID của bạn:</span>
            <strong id="my-peer-id">Đang khởi tạo...</strong>
        </div>

        <div class="main-content">
            <div class="card send-card">
                <h3>GỬI FILE</h3>
                <label for="file-input" class="custom-file-upload">
                    Chọn File Cần Gửi
                </label>
                <input type="file" id="file-input">
                <div id="file-info" class="info-text">Chưa chọn file</div>
                
                <div class="code-display-box" id="code-box" style="display: none;">
                    <p>Mã gửi file (6 số):</p>
                    <span id="generated-code">000000</span>
                </div>
            </div>

            <div class="card receive-card">
                <h3>NHẬN FILE</h3>
                <div class="input-group">
                    <input type="text" id="receive-code-input" placeholder="Nhập mã 6 số..." maxlength="6">
                    <button id="connect-btn">Nhận</button>
                </div>
            </div>
        </div>

        <div class="progress-section" id="progress-section">
            <div class="status-header">
                <span id="status-text">Sẵn sàng</span>
                <span id="status-percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
